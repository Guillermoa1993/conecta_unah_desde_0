# ─── UNAH CONECTA PUMAS ────────────────────────────────────────────────────────
# Base de datos: Render.com (PostgreSQL externo, sin contenedor local de DB)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────────────────────────────────────
  # BACKEND (Node.js + Express + TypeScript)
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unah_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-unah_conecta_pumas_2026_jwt_secret_key_cambiar_en_produccion}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - unah_network

  # ───────────────────────────────────────────────────────────────────────────
  # FRONTEND (React + Vite + Tailwind + Nginx)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unah_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unah_network

  # ───────────────────────────────────────────────────────────────────────────
  # ADMINER (Gestor Web de Base de Datos PostgreSQL)
  # ───────────────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: unah_adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - unah_network

networks:
  unah_network:
    driver: bridge
