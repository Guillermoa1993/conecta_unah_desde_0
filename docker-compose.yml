version: '3.9'

# ─── UNAH CONECTA PUMAS ────────────────────────────────────────────────────────
# Base de datos: PostgreSQL externo mediante variables de entorno
# Nunca almacenar credenciales en este archivo.
# ───────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (API Express) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production

    container_name: unah_backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_OPTIONS=--dns-result-order=ipv4first

      # Microsoft Azure
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI}

      # Correo
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend Desarrollo ─────────────────────────────────────────────────────
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development

    container_name: unah_backend_dev

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_OPTIONS=--dns-result-order=ipv4first

      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI}

      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}

    volumes:
      - ./backend:/app
      - /app/node_modules

    profiles:
      - dev

    restart: unless-stopped

  # ── Frontend Producción ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production

    container_name: unah_frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

  # ── Frontend Desarrollo ────────────────────────────────────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: unah_frontend_dev

    ports:
      - "5173:5185"

    environment:
      - VITE_API_URL=http://backend-dev:5000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend-dev

    profiles:
      - dev

    restart: unless-stopped

  # ── Adminer ────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest

    container_name: unah_adminer

    ports:
      - "8080:8080"

    restart: unless-stopped