version: '3.9'
# ─── UNAH CONECTA PUMAS ────────────────────────────────────────────────────────
# Base de datos: Render.com (PostgreSQL externo, sin contenedor local de DB)
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Backend (API Express) ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: unah_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - backup_data:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend en modo desarrollo (hot-reload) ────────────────────────────────
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: unah_backend_dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    profiles: ["dev"]
    restart: unless-stopped

  # ── Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: unah_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Frontend en modo desarrollo (Vite hot-reload) ─────────────────────────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: unah_frontend_dev
    ports:
      - "5173:5185"
    environment:
      - VITE_API_URL=http://backend-dev:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    profiles: ["dev"]
    restart: unless-stopped

  # ── Adminer (visualizador de BD) ───────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: unah_adminer
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  backup_data: